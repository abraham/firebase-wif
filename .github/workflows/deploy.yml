name: Deploy demo

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ matrix.example }})
    # Pull requests from forks can't get OIDC tokens.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        example: [firebase-tools, action-hosting-deploy, firebase-action]
    env:
      # One preview channel per run and example, so concurrent deploys don't overwrite each other.
      CHANNEL: demo-${{ github.run_number }}-${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      # The action at this commit, rather than a released tag.
      - id: wif
        uses: $/
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_WIF_SERVICE_ACCOUNT }}
          working_directory: demo

      - if: matrix.example == 'firebase-tools'
        working-directory: demo
        run: npx --yes firebase-tools hosting:channel:deploy "$CHANNEL" --expires 1h --non-interactive

      - if: matrix.example == 'action-hosting-deploy'
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          firebaseServiceAccount: ${{ steps.wif.outputs.credentials_json }}
          projectId: ${{ steps.wif.outputs.project_id }}
          channelId: ${{ env.CHANNEL }}
          expires: 1h
          entryPoint: demo

      - if: matrix.example == 'firebase-action'
        uses: w9jds/firebase-action@v15.34.0
        with:
          args: hosting:channel:deploy ${{ env.CHANNEL }} --expires 1h
        env:
          GCP_SA_KEY: ${{ steps.wif.outputs.credentials_json }}
          PROJECT_ID: ${{ steps.wif.outputs.project_id }}
          PROJECT_PATH: demo

  deploy-success:
    needs: [deploy]
    # Run even when a dependency fails, since a skipped required check counts as passing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every deploy passed
        env:
          RESULT: ${{ needs.deploy.result }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          # Fork pull requests skip the deploys on purpose, since they can't get OIDC tokens.
          if [ "$RESULT" = "success" ] || { [ "$RESULT" = "skipped" ] && [ "$FORK" = "true" ]; }; then
            exit 0
          fi
          echo "::error::The deploy jobs finished with: $RESULT"
          exit 1
